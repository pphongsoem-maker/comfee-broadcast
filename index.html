<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Comfee Broadcast</title>

  <meta name="theme-color" content="#9fdcff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Comfee Broadcast">

  <link rel="apple-touch-icon" sizes="180x180" href="./icon-180.png">
  <link rel="icon" sizes="192x192" href="./icon-192.png">
  <link rel="manifest" href="./manifest.webmanifest">

  <style>
    html,body { height:100%; margin:0; }
    body {
      display:grid; place-items:center;
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      background:linear-gradient(135deg,#dff7ff,#f7dcff,#fff1bd,#dfffe9);
    }
    .wrap { text-align:center; padding:24px; }
    img { width:112px; height:112px; border-radius:25%; box-shadow:0 12px 35px #0002; }
    h1 { font-size:22px; margin:16px 0 6px; }
    p { color:#555; margin:0; }
  </style>

  <script>
    // Launcher only: the actual Comfee Broadcast app remains on Google Apps Script.
    window.addEventListener("load", () => {
      setTimeout(() => window.location.replace("https://script.google.com/macros/s/AKfycbwk1gZgsvNoHlD0gGnjn8X1Ic0CjqgMEMoXeeWNJDQMPhLSkbsQuNjsLGzmSCEzm-Rd/exec"), 250);
    });
  </script>
</head>
<body>
  <div class="wrap">
    <img src="./icon-192.png" alt="Comfee Broadcast">
    <h1>Comfee Broadcast</h1>
    <p>Opening broadcast…</p>
  </div>
</body>
</html>
